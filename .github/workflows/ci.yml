name: CI

on:
  pull_request:
  push:
    branches: [main, master, dependency-internalization]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: List dependency modules
        run: go list -m all

      - name: Compile and test every package
        run: go test ./...
