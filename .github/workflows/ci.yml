name: CI

on:
  pull_request:
  push:
    branches: [main, master, dependency-internalization]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve and verify module graph
        run: |
          go mod tidy
          go mod verify
          go list -m all | awk '
            NR == 1 { next }
            $1 ~ /^golang[.]org\// { next }
            $1 ~ /^google[.]golang[.]org\// { next }
            $1 ~ /^github[.]com\/oiweiwei\// { next }
            { print "Forbidden module: " $1; bad = 1 }
            END { exit bad }'
          git diff --exit-code -- go.mod go.sum

      - name: Compile and test every package
        run: go test ./...

      - name: Vet every package
        run: go vet ./...
